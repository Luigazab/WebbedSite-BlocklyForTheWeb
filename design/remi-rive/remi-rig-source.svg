<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <title>Remi — Rive rig source</title>
  <desc>Layered vector artwork prepared for import into Rive. Keep group ids when importing.</desc>
  <defs>
    <linearGradient id="bodyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78c9ff"/>
      <stop offset="0.58" stop-color="#4a9cf2"/>
      <stop offset="1" stop-color="#2d75d5"/>
    </linearGradient>
    <linearGradient id="legGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c98ed"/>
      <stop offset="1" stop-color="#1f58ad"/>
    </linearGradient>
    <linearGradient id="irisGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122353"/>
      <stop offset="0.65" stop-color="#0c3f91"/>
      <stop offset="1" stop-color="#2c8ee8"/>
    </linearGradient>
  </defs>

  <!-- Imported groups intentionally use rig-friendly names and neutral transforms. -->
  <g id="remi_scene">
    <g id="shadow" opacity="0.17">
      <ellipse id="shadow_shape" cx="256" cy="331" rx="142" ry="19" fill="#4c78aa"/>
    </g>

    <g id="remi_root">

    <g id="legs_back">
      <g id="leg_back_left_outer" transform="translate(142 237)">
        <path id="leg_back_left_outer_shape" d="M0 0C-42 2-68 35-63 68c3 21 18 33 34 28 13-4 16-18 18-33 2-13 9-22 25-25z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
      </g>
      <g id="leg_back_left_inner" transform="translate(188 254)">
        <path id="leg_back_left_inner_shape" d="M0 0c-29 8-43 33-36 59 5 20 21 28 35 19 11-7 10-19 11-31 1-10 7-18 18-23z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
      </g>
      <g id="leg_back_right_inner" transform="translate(324 254)">
        <path id="leg_back_right_inner_shape" d="M0 0c29 8 43 33 36 59-5 20-21 28-35 19-11-7-10-19-11-31-1-10-7-18-18-23z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
      </g>
      <g id="leg_back_right_outer" transform="translate(370 237)">
        <path id="leg_back_right_outer_shape" d="M0 0c42 2 68 35 63 68-3 21-18 33-34 28-13-4-16-18-18-33-2-13-9-22-25-25z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
      </g>
    </g>

    <g id="legs_front">
      <g id="leg_front_left_outer" transform="translate(128 250)">
        <path id="leg_front_left_outer_shape" d="M0 0c-39 9-58 42-47 75 7 23 25 32 42 20 14-10 10-26 13-41 2-12 10-21 24-27z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
        <ellipse id="leg_front_left_outer_spot" cx="-16" cy="35" rx="12" ry="18" transform="rotate(25 -16 35)" fill="#ffe783"/>
      </g>
      <g id="leg_front_left_inner" transform="translate(179 267)">
        <path id="leg_front_left_inner_shape" d="M0 0c-27 9-40 34-32 59 6 19 22 25 35 15 10-8 8-20 9-31 1-9 7-16 18-21z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
        <ellipse id="leg_front_left_inner_spot" cx="-9" cy="26" rx="10" ry="15" transform="rotate(18 -9 26)" fill="#ffe783"/>
      </g>
      <g id="leg_front_right_inner" transform="translate(333 267)">
        <path id="leg_front_right_inner_shape" d="M0 0c27 9 40 34 32 59-6 19-22 25-35 15-10-8-8-20-9-31-1-9-7-16-18-21z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
        <ellipse id="leg_front_right_inner_spot" cx="9" cy="26" rx="10" ry="15" transform="rotate(-18 9 26)" fill="#ffe783"/>
      </g>
      <g id="leg_front_right_outer" transform="translate(384 250)">
        <path id="leg_front_right_outer_shape" d="M0 0c39 9 58 42 47 75-7 23-25 32-42 20-14-10-10-26-13-41-2-12-10-21-24-27z" fill="url(#legGradient)" stroke="#104897" stroke-width="7" stroke-linejoin="round"/>
        <ellipse id="leg_front_right_outer_spot" cx="16" cy="35" rx="12" ry="18" transform="rotate(-25 16 35)" fill="#ffe783"/>
      </g>
    </g>

    <g id="body" transform="translate(256 188)">
      <path id="body_shape" d="M-139 31C-139-58-77-112 0-112S139-58 139 31c0 68-55 100-139 100S-139 99-139 31z" fill="url(#bodyGradient)" stroke="#0b459c" stroke-width="8" stroke-linejoin="round"/>
      <path id="body_lower_shade" d="M-130 65c25 43 72 61 130 61s105-18 130-61c-12 53-61 74-130 74S-118 118-130 65z" fill="#145cb9" opacity="0.38"/>
      <g id="body_spots" fill="#2679dd">
        <ellipse id="spot_center" cx="0" cy="-89" rx="22" ry="10"/>
        <ellipse id="spot_left" cx="-58" cy="-78" rx="12" ry="6" transform="rotate(-16 -58 -78)"/>
        <ellipse id="spot_right" cx="58" cy="-78" rx="12" ry="6" transform="rotate(16 58 -78)"/>
      </g>
      <g id="body_highlights" fill="#b8e9ff" opacity="0.75">
        <ellipse id="highlight_left" cx="-78" cy="-65" rx="17" ry="7" transform="rotate(-25 -78 -65)"/>
        <ellipse id="highlight_right" cx="72" cy="-62" rx="16" ry="7" transform="rotate(24 72 -62)"/>
      </g>
    </g>

    <g id="face" transform="translate(256 190)">
      <g id="eyebrows">
        <path id="eyebrow_left" d="M-78-35c13-12 27-12 39-2" fill="none" stroke="#0a285f" stroke-width="7" stroke-linecap="round"/>
        <path id="eyebrow_right" d="M39-37c12-10 27-10 39 2" fill="none" stroke="#0a285f" stroke-width="7" stroke-linecap="round"/>
      </g>

      <g id="eye_left" transform="translate(-54 -1)">
        <ellipse id="eye_left_white" cx="0" cy="0" rx="42" ry="49" fill="#fffdf4" stroke="#07152f" stroke-width="6"/>
        <g id="eye_left_iris" transform="translate(6 5)">
          <ellipse id="eye_left_iris_shape" cx="0" cy="0" rx="25" ry="34" fill="url(#irisGradient)"/>
          <ellipse id="eye_left_pupil" cx="0" cy="-5" rx="14" ry="22" fill="#06143b"/>
          <circle id="eye_left_glint_large" cx="-8" cy="-17" r="7" fill="#fff"/>
          <circle id="eye_left_glint_small" cx="8" cy="-4" r="3.5" fill="#fff" opacity="0.9"/>
        </g>
        <path id="eye_left_lid" d="M-39 1C-22-23 20-26 40 0C27-17-25-17-39 1z" fill="#63b7f8" opacity="0"/>
      </g>

      <g id="eye_right" transform="translate(54 -1)">
        <ellipse id="eye_right_white" cx="0" cy="0" rx="42" ry="49" fill="#fffdf4" stroke="#07152f" stroke-width="6"/>
        <g id="eye_right_iris" transform="translate(-6 5)">
          <ellipse id="eye_right_iris_shape" cx="0" cy="0" rx="25" ry="34" fill="url(#irisGradient)"/>
          <ellipse id="eye_right_pupil" cx="0" cy="-5" rx="14" ry="22" fill="#06143b"/>
          <circle id="eye_right_glint_large" cx="-8" cy="-17" r="7" fill="#fff"/>
          <circle id="eye_right_glint_small" cx="8" cy="-4" r="3.5" fill="#fff" opacity="0.9"/>
        </g>
        <path id="eye_right_lid" d="M-40 0C-20-26 22-23 39 1C25-17-27-17-40 0z" fill="#63b7f8" opacity="0"/>
      </g>

      <g id="cheeks" fill="#ff9daf">
        <ellipse id="cheek_left" cx="-102" cy="54" rx="22" ry="13" transform="rotate(8 -102 54)"/>
        <ellipse id="cheek_right" cx="102" cy="54" rx="22" ry="13" transform="rotate(-8 102 54)"/>
      </g>

      <g id="mouths" transform="translate(0 58)">
        <g id="mouth_smile">
          <path id="mouth_smile_line" d="M-17 0c8 16 26 16 34 0" fill="none" stroke="#07152f" stroke-width="7" stroke-linecap="round"/>
        </g>
        <g id="mouth_open" opacity="0">
          <path id="mouth_open_shape" d="M-25-3c11-8 39-7 49 1 0 27-13 39-25 39-14 0-25-14-24-40z" fill="#7f254e" stroke="#07152f" stroke-width="6" stroke-linejoin="round"/>
          <path id="mouth_open_tongue" d="M-15 24c9-7 22-8 31-1-4 9-10 14-17 14-6 0-11-5-14-13z" fill="#ff718a"/>
        </g>
        <g id="mouth_small_o" opacity="0">
          <ellipse id="mouth_small_o_shape" cx="0" cy="9" rx="8" ry="10" fill="#7f254e" stroke="#07152f" stroke-width="5"/>
        </g>
        <g id="mouth_sleep" opacity="0">
          <path id="mouth_sleep_line" d="M-13 9c7-5 19-5 26 0" fill="none" stroke="#07152f" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <g id="fx" fill="none" stroke="#ffbd32" stroke-width="9" stroke-linecap="round" opacity="0">
      <g id="fx_left" transform="translate(103 118)">
        <path id="fx_left_line_1" d="M0 25L-16 9"/>
        <path id="fx_left_line_2" d="M18 12L12-10"/>
      </g>
      <g id="fx_right" transform="translate(409 118)">
        <path id="fx_right_line_1" d="M0 25L16 9"/>
        <path id="fx_right_line_2" d="M-18 12L-12-10"/>
      </g>
    </g>
    </g>
  </g>
</svg>
